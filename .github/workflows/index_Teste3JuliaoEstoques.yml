# ==========================================================
# Azure Web Apps Deploy - Frontend Vite + React
# Utiliza as mesmas credenciais do backend
# ==========================================================

name: Build and deploy Vite frontend to Azure Web App - Teste101Estoques

on:
  push:
    branches:
      - index          # deploy ao dar push na branch index
  workflow_dispatch:    # permite rodar manualmente pelo GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Baixa o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configura o Node.js (use a versão LTS)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # 3️⃣ Instala dependências e faz o build
      - name: Install dependencies and build project
        run: |
          npm ci
          npm run build

      # 4️⃣ Faz upload dos arquivos prontos para o job de deploy
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vite-frontend
          path: dist  # pasta gerada pelo npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 1️⃣ Baixa o artefato buildado
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-frontend

      # 2️⃣ Faz login no Azure usando as mesmas credenciais do backend
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E75DCDEBC8C846F2901F869CF27394E5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_67F3959A13334FCDB3B25C922F92B5C0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_27894FC84491456D83CB6B80EFDEEE47 }}

      # 3️⃣ Faz o deploy para o App Service (mesmo grupo do back, se quiser)
      - name: Deploy Vite frontend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Teste101Estoques'   # pode ser outro App Service se quiser separar
          slot-name: 'Production'
          package: .
